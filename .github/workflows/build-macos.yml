name: Build iOS Library

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      - name: Resolve package
        run: swift package resolve

      - name: Build package
        run: xcodebuild -scheme DylibLoginKit -destination 'generic/platform=iOS' build

      - name: Run tests
        run: xcodebuild -scheme DylibLoginKit -destination 'platform=iOS Simulator,name=iPhone 17' test

      - name: Archive device framework
        run: xcodebuild archive -scheme DylibLoginKit -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/device" SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Archive simulator framework
        run: xcodebuild archive -scheme DylibLoginKit -destination 'generic/platform=iOS Simulator' -archivePath "$RUNNER_TEMP/simulator" SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Create xcframework
        run: |
          DEVICE_FRAMEWORK=$(find "$RUNNER_TEMP/device.xcarchive" -type d -name 'DylibLoginKit.framework' -print -quit)
          SIMULATOR_FRAMEWORK=$(find "$RUNNER_TEMP/simulator.xcarchive" -type d -name 'DylibLoginKit.framework' -print -quit)
          test -n "$DEVICE_FRAMEWORK" && test -n "$SIMULATOR_FRAMEWORK"
          xcodebuild -create-xcframework -framework "$DEVICE_FRAMEWORK" -framework "$SIMULATOR_FRAMEWORK" -output DylibLoginKit.xcframework

      - name: Zip xcframework
        run: zip -qr DylibLoginKit.xcframework.zip DylibLoginKit.xcframework

      - name: Archive source package
        run: zip -qr DylibLoginKit-source.zip Package.swift Sources Tests README.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DylibLoginKit-build
          path: |
            DylibLoginKit.xcframework.zip
            DylibLoginKit-source.zip
