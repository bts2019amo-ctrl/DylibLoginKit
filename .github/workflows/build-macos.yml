name: Build iOS Library

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      - name: Resolve package
        run: swift package resolve

      - name: Build package
        run: swift build -v

      - name: Run tests
        run: swift test -v

      - name: Archive source package
        run: zip -qr DylibLoginKit-source.zip Package.swift Sources Tests README.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DylibLoginKit-source
          path: DylibLoginKit-source.zip
